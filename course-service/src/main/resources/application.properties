# ==========================================================
#  COURSE SERVICE - APPLICATION CONFIG
# ==========================================================

server.port=5002
spring.application.name=course-service

# ==========================================================
#  DATABASE - MySQL
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/course_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=course_user
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
#  JPA / HIBERNATE
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Không c?n khai báo dialect n?a ? Hibernate 6 t? detect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Fix warning "spring.jpa.open-in-view is enabled by default"
spring.jpa.open-in-view=false

# ==========================================================
#  JWT
# ==========================================================
app.jwt.secret=day_la_secret_key_rat_dai_cho_hs256_algorithm_it_nhat_32_bytes
app.jwt.expiration=604800000

# ==========================================================
#  SECURITY - Tài kho?n m?c ??nh (dùng t?m khi test)
# ==========================================================
spring.security.user.name=admin
spring.security.user.password=admin123

# ==========================================================
#  LOGGING
# ==========================================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG