# Server Configuration
server.port=8084
server.servlet.context-path=/

# Application Name
spring.application.name=registration-service

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/registration_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# External Microservices URLs
services.student.url=http://localhost:8082
services.course.url=http://localhost:8083

# Swagger OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka Discovery Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
